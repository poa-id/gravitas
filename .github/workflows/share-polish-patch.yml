name: Share polish patch

on:
  push:
    branches: [feature/share-for-review]
    paths:
      - .github/workflows/share-polish-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/share-for-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch editor and proofing lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path('src/editor/Editor.tsx')
          text = editor.read_text()
          old = "import { createScratchPromotePlugin, scratchReadonlyExtension } from './plugins/scratchPromote'"
          new = old + "\nimport { spellcheckPlugin } from './plugins/spellcheck'"
          if "spellcheckPlugin" not in text:
              assert old in text
              text = text.replace(old, new, 1)
          needle = "scratchReadonlyExtension(()=>isScratchRef.current),...typewriterExtensions"
          if "scratchReadonlyExtension(()=>isScratchRef.current),spellcheckPlugin,...typewriterExtensions" not in text:
              assert needle in text
              text = text.replace(needle, "scratchReadonlyExtension(()=>isScratchRef.current),spellcheckPlugin,...typewriterExtensions", 1)
          note_needle = "{active.comment&&<p>{active.comment}</p>}{active.reviewerName&&<span className=\"gv-reviewer-name\">— {active.reviewerName}</span>}"
          note_replacement = "{active.comment&&<p>{active.comment}</p>}{active.reviewerNote&&<p className=\"gv-reviewer-note\"><span>Review note</span>{active.reviewerNote}</p>}{active.reviewerName&&<span className=\"gv-reviewer-name\">— {active.reviewerName}</span>}"
          if "gv-reviewer-note" not in text:
              assert note_needle in text
              text = text.replace(note_needle, note_replacement, 1)
          editor.write_text(text)

          spell = Path('src/editor/plugins/spellcheck.ts')
          text = spell.read_text()
          old = "if (this.grammarLinter) void this.grammarLinter.dispose()"
          new = "if (this.grammarLinter) void Promise.resolve(this.grammarLinter.dispose()).catch(() => {})"
          if new not in text:
              assert old in text
              text = text.replace(old, new, 1)
          spell.write_text(text)

          css = Path('src/editor/Editor.css')
          text = css.read_text()
          rule = ".gv-reviewer-note{display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid var(--border);color:var(--text-dim)!important}.gv-reviewer-note span{font-family:var(--font-ui);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dimmer)}"
          if '.gv-reviewer-note{' not in text:
              text += "\n" + rule + "\n"
          css.write_text(text)
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/Editor.tsx src/editor/Editor.css src/editor/plugins/spellcheck.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore proofing and show reviewer notes"
          git push
